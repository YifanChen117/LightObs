apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: Service
metadata:
  name: demo-nginx
  namespace: demo
spec:
  selector:
    app: demo-nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-nginx
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-nginx
  template:
    metadata:
      labels:
        app: demo-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: demo-curl
  namespace: demo
spec:
  restartPolicy: Always
  containers:
    - name: wget
      image: nginx:1.27
      command:
        - sh
        - -c
        - |
          set -e
          echo "start curling demo-nginx..."
          while true; do
            wget -q -O /dev/null http://demo-nginx.demo.svc.cluster.local/ && echo "ok" || echo "fail"
            sleep 0.5
          done
